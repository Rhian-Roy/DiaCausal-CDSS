[pytest]
# Run from the project root:
#
#     python -m pytest tests/ -q                    # everything (~85s)
#     python -m pytest tests/ -q -m "not slow"      # skip the library cross-checks (~37s)
#
# `testpaths` and `pythonpath` are set so that a bare `pytest` works from the repo
# root without anyone having to remember flags or export PYTHONPATH — the test
# module also inserts the root on sys.path itself, so it still runs if invoked
# directly from another directory.
#
# `MPLCONFIGDIR` is NOT set here on purpose: doing that needs the pytest-env
# plugin, which is not installed, and an unknown ini key fails silently. The test
# module sets it with os.environ.setdefault before anything imports matplotlib,
# which is the reliable place for it.
testpaths = tests
pythonpath = .
addopts = --strict-markers

markers =
    slow: needs DoWhy/EconML or repeated refits — the agreement and refutation suites

# Narrow on purpose. A blanket `ignore::UserWarning` would also swallow pytest's
# own configuration warnings and sklearn's convergence warnings, both of which we
# want to see.
filterwarnings =
    ignore:.*is deprecated.*:DeprecationWarning
    ignore::FutureWarning
