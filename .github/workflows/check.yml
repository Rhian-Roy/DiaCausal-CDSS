# One command, the same one a teammate runs locally: scripts/check_all.py.
#   part A  the chat app (backend, frontend, live servers, vignettes, real browser)
#   part B  the engine side (engine, RAG, guards, contract, imports, no-legacy, log privacy, web parity,
#           XAI tests, quick benchmark, quick A-D ablation, pip-audit)
# It runs on every pull request on Linux and macOS. Windows only proves that the one-time setup works.
# A red cross on GitHub means something broke; click it to see which [FAIL] line.
#
# CI NEVER DEPLOYS THE WEBSITE. The Netlify site `diacausal` is not connected to GitHub and is deployed by hand
# (docs/DEPLOY.md section 9; each production deploy costs credits). No job here uses Netlify, a deploy hook, a deploy
# token or `--prod`, and tests/test_ci_workflows.py fails if one is added.
name: check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: One-time setup (the chat app)
        run: python scripts/setup.py
      - name: Install the engine's libraries, SHAP and LIME (part B)
        run: python -m pip install --disable-pip-version-check -q -r requirements-xai.txt
      - name: Check everything (scripts/check_all.py)
        run: python scripts/check_all.py

  # Windows proves the one-time setup works there (backend/.venv, frontend libraries); the checks themselves run on Linux and macOS.
  setup-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: One-time setup
        run: python scripts/setup.py

  # The real-browser tests with their failure report kept for a week (check_all.py runs the same tests, without the report).
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: One-time setup
        run: python scripts/setup.py
      - name: End-to-end tests in Chrome
        working-directory: tests/e2e
        run: npm test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/test-results/
          retention-days: 7

  # The page's npm libraries. (The Python libraries are audited by check_all.py, part B.) Separate from `check`, so a newly
  # published advisory does not hide a real test failure (and the other way round).
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Page libraries (npm audit)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
