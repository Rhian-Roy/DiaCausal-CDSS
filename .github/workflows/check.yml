# Runs the same one-command check a teammate runs locally (scripts/check_all.py),
# on Linux, Windows and macOS, for every push and pull request. A red cross on
# GitHub means something broke; click it to see which [FAIL] line.
name: check

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: One-time setup
        run: python scripts/setup.py
      - name: Check everything
        run: python scripts/check_all.py

  # The 3-arm causal engine (diacausal_engine/, demo/, data/rules.csv, data/params.yaml).
  # Its own pinned requirements, so the chat app's setup above is not needed.
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the engine's libraries
        run: python -m pip install --disable-pip-version-check -q -r requirements-engine.txt
      - name: Engine tests
        run: python -m pytest tests/engine -q
      - name: RAG skeleton tests
        run: python -m pytest tests/rag -q
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Website tests (the browser engine gives the same answers as Python)
        run: python -m pytest tests/web -q
      - name: Quick benchmark (writes to a temporary folder)
        run: python -m diacausal_engine.benchmark --quick --out "${{ runner.temp }}/results"
      - name: Known security problems in the engine's libraries (pip-audit)
        run: |
          python -m pip install --disable-pip-version-check -q pip-audit==2.9.0
          python -m pip_audit -r requirements-engine.txt --strict --progress-spinner off

  # The real-browser tests need Chrome; the Linux runner has it. The matrix job above
  # already runs everything else on Linux, Windows and macOS.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: One-time setup
        run: python scripts/setup.py
      - name: End-to-end tests in Chrome
        working-directory: e2e
        run: npm test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/test-results/
          retention-days: 7

  # Known security problems in the libraries we depend on. Separate from `check` so a
  # newly published advisory does not hide a real test failure (and the other way round).
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Python libraries (pip-audit)
        run: |
          python -m pip install --disable-pip-version-check -q pip-audit==2.9.0
          python -m pip_audit -r backend/requirements-dev.txt --strict --progress-spinner off
      - name: Page libraries (npm audit)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
