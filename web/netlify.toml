# Netlify settings for the DiaCausal website (static; no build step).
[build]
  publish = "."
  command = ""
  # Skip every Git-triggered build: this site is deployed by hand (docs/DEPLOY.md section 9), so even if it were ever connected
  # to GitHub, a push or a pull request would not cost production-deploy credits. a `netlify deploy` of the folder runs no build.
  ignore = "exit 0"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://txdzvqcserowgcotpqgj.supabase.co; font-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
