[pytest]
# The old 2-arm research code and its tests. Run from this folder:
#
#     cd legacy && ../.venv/bin/python -m pytest tests -q -p no:cacheprovider
#
# `pythonpath = .` makes `import causal_engine` find legacy/causal_engine/. The five tests that
# need DoWhy, EconML or NetworkX skip (with the reason printed by `-rs`) when those libraries
# are not installed; install `legacy/requirements.txt` to run them. CI does not run this folder.
testpaths = tests
pythonpath = .
addopts = --strict-markers

markers =
    slow: needs DoWhy/EconML or repeated refits — the agreement and refutation suites

filterwarnings =
    ignore:.*is deprecated.*:DeprecationWarning
    ignore::FutureWarning
